name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "3 22 * * 3"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ java ]

    steps:
      # 1. Checkout must happen first
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Upgraded to v4 for Node.js/runner compatibility
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          java-package: jdk

      # 3. Upgraded to v3 and added build-mode: none
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          build-mode: none

      # NOTE: The Autobuild step has been removed completely.
      # Buildless mode does not require compilation.

      # 4. Upgraded to v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
